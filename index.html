<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>聪明的神经猫</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eeeeee;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #222222;
        }

        #catch-the-cat {
            width: 100%;
            margin-top: 24px;
            text-align: center;
        }

        /* Shrink the fixed-size canvas on narrow screens */
        #catch-the-cat canvas {
            max-width: calc(100% - 32px);
            height: auto !important;
        }

        .panel {
            max-width: 480px;
            margin: 16px auto;
            padding: 0 16px;
            text-align: center;
            line-height: 1.6;
        }

        .switch button {
            font: inherit;
            padding: 6px 16px;
            margin: 0 4px;
            border: 1px solid #003366;
            border-radius: 4px;
            background: #ffffff;
            color: #003366;
            cursor: pointer;
        }

        .switch button.active {
            background: #003366;
            color: #ffffff;
        }

        .hint {
            margin-top: 8px;
            font-size: 14px;
            color: #555555;
        }

        a {
            color: #003366;
        }

        .options {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            width: fit-content;
            margin: 12px auto 0;
            font-size: 14px;
            text-align: left;
        }

        .options select {
            font: inherit;
            padding: 2px 4px;
        }
    </style>
</head>
<body>
    <script src="vendor/phaser.min.js"></script>
    <script src="vendor/catch-the-cat.js"></script>
    <script src="src/cat-ai.js"></script>
    <script src="src/variants.js"></script>
    <div id="catch-the-cat"></div>
    <div class="panel">
        <div class="switch">
            <button type="button" data-cat="smart">聪明猫</button>
            <button type="button" data-cat="classic">原版猫</button>
        </div>
        <p class="hint" id="hint"></p>
        <div class="options">
            <label>棋盘
                <select id="size" autocomplete="off">
                    <option value="9">9×9（猫离边 4 步）</option>
                    <option value="11" selected>11×11（原版）</option>
                    <option value="13">13×13（猫离边 6 步）</option>
                    <option value="15">15×15（猫离边 7 步）</option>
                </select>
            </label>
            <label><input type="checkbox" data-rule="double" autocomplete="off"> 你每回合放两块墙</label>
            <label><input type="checkbox" data-rule="nap" autocomplete="off"> 猫每走两步打一次盹</label>
            <label><input type="checkbox" data-rule="edge" autocomplete="off"> 猫在边上要喘口气才能逃</label>
        </div>
        <p class="hint" id="rules-hint"></p>
        <p class="hint">
            <label><input type="checkbox" id="show-plan"> 偷看猫的打算</label>
            <span id="plan"></span>
        </p>
        <p class="hint"><a href="go.html">和聪明猫下一盘 9 路围棋</a></p>
        <p class="hint">
            游戏本体来自 <a href="https://github.com/ganlvtech/phaser-catch-the-cat">ganlvtech/phaser-catch-the-cat</a>，
            这里只换了猫的 AI
        </p>
    </div>
    <script>
        var cats = {
            smart: {
                solver: CatAI.smartSolver,
                hint: "聪明猫会预判你下一步堵哪里，只走堵不住的路；把它关进逃不出去的口袋就算你赢"
            },
            classic: {
                solver: CatAI.classicSolver,
                hint: "原版猫只会沿最短路线往边上跑，没路了就认输"
            }
        };

        var ruleInfo = {
            double: {key: "wallsPerTurn", value: 2, text: "你每回合放两块墙，猫才走一步"},
            nap: {key: "napEvery", value: 3, text: "猫每走两步就打一次盹，那回合不动"},
            edge: {key: "edgeStay", value: true, text: "猫走到边上要停一回合才能逃，这时把它身边堵满就算抓到"}
        };
        var settings = {cat: "smart", size: 11, rules: []};

        // Any change of cat, board size or rules starts a new game.
        function startGame() {
            var rules = {};
            settings.rules.forEach(function (name) {
                rules[ruleInfo[name].key] = ruleInfo[name].value;
            });
            CatVariants.createGame({
                parent: "catch-the-cat",
                size: settings.size,
                rules: rules,
                solver: cats[settings.cat].solver
            });

            document.getElementById("hint").textContent = cats[settings.cat].hint;
            document.querySelectorAll(".switch button").forEach(function (b) {
                b.classList.toggle("active", b.getAttribute("data-cat") === settings.cat);
            });
            document.getElementById("size").value = String(settings.size);
            document.querySelectorAll("[data-rule]").forEach(function (box) {
                box.checked = settings.rules.indexOf(box.getAttribute("data-rule")) >= 0;
            });
            document.getElementById("rules-hint").textContent = settings.rules.length
                ? "新规则：" + settings.rules.map(function (name) { return ruleInfo[name].text; }).join("；")
                : "";

            var url = new URL(location.href);
            url.searchParams.set("cat", settings.cat);
            url.searchParams.set("size", settings.size);
            if (settings.rules.length) {
                url.searchParams.set("rules", settings.rules.join(","));
            } else {
                url.searchParams.delete("rules");
            }
            history.replaceState(null, "", url);
            lastKey = "";
        }

        document.querySelectorAll(".switch button").forEach(function (b) {
            b.addEventListener("click", function () {
                settings.cat = b.getAttribute("data-cat");
                startGame();
            });
        });
        document.getElementById("size").addEventListener("change", function (e) {
            settings.size = Number(e.target.value);
            startGame();
        });
        document.querySelectorAll("[data-rule]").forEach(function (box) {
            box.addEventListener("change", function () {
                settings.rules = [];
                document.querySelectorAll("[data-rule]").forEach(function (b) {
                    if (b.checked) settings.rules.push(b.getAttribute("data-rule"));
                });
                startGame();
            });
        });

        var params = new URLSearchParams(location.search);
        if (cats[params.get("cat")]) {
            settings.cat = params.get("cat");
        }
        if (["9", "11", "13", "15"].indexOf(params.get("size")) >= 0) {
            settings.size = Number(params.get("size"));
        }
        settings.rules = (params.get("rules") || "").split(",").filter(function (name) {
            return ruleInfo[name];
        });

        // "Peek" asks the current cat where it would step on the board as it
        // is now; the wall you place next can change its mind. The facing of
        // the cat at the start of a game is only a fixed default pose
        // (bottom-left) and says nothing about this.
        var directionNames = ["左", "左上", "右上", "右", "右下", "左下"];
        var lastKey = "";
        startGame();

        function updatePlan() {
            var planEl = document.getElementById("plan");
            var scene = window.game.scene.scenes[0];
            if (!document.getElementById("show-plan").checked || !scene || !scene.cat || !scene.blocksData) {
                planEl.textContent = "";
                lastKey = "";
                return;
            }
            var cat = scene.cat;
            var key = scene.state + "|" + cat.i + "," + cat.j + "|" + settings.cat + "|" +
                scene.blocksData.map(function (col) {
                    return col.map(function (x) { return x ? 1 : 0; }).join("");
                }).join("");
            if (key === lastKey) {
                return;
            }
            lastKey = key;
            if (scene.state !== "playing") {
                planEl.textContent = "";
                return;
            }
            var dir = cat.solver(scene.blocksData, cat.i, cat.j);
            planEl.textContent = dir >= 0 && dir <= 5
                ? "：按现在的棋盘它想往「" + directionNames[dir] + "」走，你放的墙可能让它改主意"
                : "：它已经没路了";
        }

        document.getElementById("show-plan").addEventListener("change", updatePlan);
        setInterval(updatePlan, 300);
    </script>
</body>
</html>
